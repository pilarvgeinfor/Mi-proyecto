 <!-- CABECERA -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light rounded shadow-sm mb-4 fixed-top p-0 m-0">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-dark" href="#">
        <img src="assets/logo.png" alt="CryptoLogo" width="20" height="20" class="me-0">
        ECRYPTO
    </a>
      <form class="d-flex ms-auto" (submit)="searchCoins(); $event.preventDefault()">
        <div class="position-relative">
            <input
            class="form-control me-2"
            type="search"
            placeholder="Buscar criptomoneda..."
            aria-label="Buscar"
            [(ngModel)]="searchTerm"
            (input)="getSearchSuggestions()"  
            name="search"
            data-cy="search-input"
            />

            <button *ngIf="searchTerm" type="button" class="btn position-absolute end-0 top-50 translate-middle-y me-4 p-0 border-0 bg-transparent" (click)="clearSearch()" aria-label="Limpiar búsqueda"> </button>

            <ul *ngIf="searchSuggestions.length> 0" class="list-group position-absolute w-100 mt-1 shadow-sm" style="z-index: 10;">
                <li *ngFor="let coin of searchSuggestions" class="list-group-item list-group-item-action d-flex align-items-center" (click)="selectSuggestion(coin.name)" style="cursor: pointer;">
                    <img [src]="coin.image" alt="{{coin.name}}" width="24" class="me-2">
                    {{ coin.name }}({{ coin.symbol | uppercase }})
                </li>
            </ul>
        </div>
        <button class="btn btn-outline-primary" type="submit">Buscar</button>
      </form>
    </div>
  </nav>
